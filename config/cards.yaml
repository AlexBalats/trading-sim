tracked:                   # 9 now; the 10th (a new-set card) arrives with events in iteration 2
  chase: [C01, C02]
  fan_favourite: [U01]
  mid_tier: [R01, R02, U02]
  common: [M01, M02]
  hype_target: [R03]
